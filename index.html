<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riddle.exe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:'Courier New',monospace}
.wrap{width:100%;max-width:480px;background:#0f0f18;border:2px solid #1e1e30;border-radius:6px;padding:1.5rem;position:relative}
.corner{position:absolute;width:14px;height:14px}
.tl{top:8px;left:8px;border-top:2px solid #39ff14;border-left:2px solid #39ff14}
.tr{top:8px;right:8px;border-top:2px solid #39ff14;border-right:2px solid #39ff14}
.bl{bottom:8px;left:8px;border-bottom:2px solid #39ff14;border-left:2px solid #39ff14}
.br{bottom:8px;right:8px;border-bottom:2px solid #39ff14;border-right:2px solid #39ff14}
.badge{text-align:center;margin-bottom:1.2rem}
.badge span{font-size:10px;color:#39ff14;border:2px solid #39ff14;padding:5px 12px;letter-spacing:2px}
h1{text-align:center;font-size:20px;color:#e8e8f0;margin-bottom:4px;letter-spacing:1px}
.sub{text-align:center;font-size:13px;color:#555570;margin-bottom:1.4rem;letter-spacing:1px}
.riddle-box{background:#0a0a0f;border:1px solid #1e1e30;border-radius:4px;padding:1.2rem;margin-bottom:1.2rem}
.rlabel{font-size:9px;color:#ffb800;margin-bottom:0.8rem;letter-spacing:1px}
.rtext{font-size:17px;color:#e8e8f0;line-height:1.6}
.hints{margin-top:1rem;display:flex;flex-direction:column;gap:6px}
.hint-item{display:flex;align-items:center;gap:8px}
.hint-num{font-size:9px;color:#39ff14;min-width:20px}
.hint-btn{font-size:12px;color:#333350;background:#0a0a0f;border:1px dashed #2a2a3d;padding:5px 10px;cursor:pointer;border-radius:3px;font-family:inherit;transition:all .2s;flex:1;text-align:left;letter-spacing:0.5px}
.hint-btn:hover{color:#ffb800;border-color:#ffb800}
.hint-btn.revealed{color:#ffb800;border-color:#ffb800;border-style:solid;cursor:default}.hint-btn.locked{color:#333350;border-style:dashed;cursor:not-allowed}
.lives{display:flex;gap:6px;margin-bottom:0.8rem}
.heart{color:#ff3c3c;font-size:16px;transition:opacity .3s}
.heart.lost{opacity:.2}
.input-row{display:flex;gap:8px;margin-bottom:0.8rem}
input[type=text]{flex:1;background:#0a0a0f;border:2px solid #1e1e30;color:#e8e8f0;font-family:inherit;font-size:18px;padding:9px 12px;outline:none;border-radius:4px;transition:border-color .2s;min-width:0;letter-spacing:1px}
input[type=text]:focus{border-color:#00e5ff}
input[type=text]::placeholder{color:#333350;font-size:14px;letter-spacing:0}
input:disabled{opacity:.5}
.btn{background:#39ff14;color:#000;font-family:inherit;font-size:9px;border:none;padding:0 14px;cursor:pointer;border-radius:4px;font-weight:bold;letter-spacing:1px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:#55ff30}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.feedback{font-size:18px;min-height:26px;margin-bottom:4px;color:#39ff14}
.feedback.wrong{color:#ff3c3c;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qr-section{display:none;flex-direction:column;align-items:center;gap:1rem;margin-top:1.2rem;animation:fadeIn .5s ease}
.qr-section.show{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qr-label{font-size:9px;color:#39ff14;text-align:center;letter-spacing:1px}
.qr-frame{background:#fff;padding:10px;border:2px solid #39ff14}
.qr-link{font-size:14px;color:#00e5ff;text-align:center;word-break:break-all}
@media(max-width:360px){h1{font-size:16px}.rtext{font-size:15px}input[type=text]{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="badge"><span>&#9670; RIDDLE.EXE &#9670;</span></div>
  <h1>MYSTERY BOX</h1>
  <div class="sub">// siapa rapper favorit gue? //</div>

  <div class="riddle-box">
    <div class="rlabel">&gt;&gt; RIDDLE_01.dat</div>
    <div class="rtext">
      Dari kota Philly, dia belum jadi nama gede tapi suaranya mulai kedengeran. Beat mostly self-produce dan lirik dia tulis sendiri, bukan anak label.
    </div>
    <div class="hints">
      <div class="hint-item">
        <span class="hint-num">H1</span>
        <button class="hint-btn locked" id="h1">[ terbuka dalam <span id="t1"></span> ]</button>
      </div>
      <div class="hint-item">
        <span class="hint-num">H2</span>
        <button class="hint-btn locked" id="h2">[ terbuka dalam <span id="t2"></span> ]</button>
      </div>
      <div class="hint-item">
        <span class="hint-num">H3</span>
        <button class="hint-btn locked" id="h3">[ terbuka dalam <span id="t3"></span> ]</button>
      </div>
    </div>
  </div>

  <div class="lives" id="lives">
    <span class="heart">&#9829;</span>
    <span class="heart">&#9829;</span>
    <span class="heart">&#9829;</span>
  </div>

  <div class="input-row">
    <input type="text" id="answerInput" placeholder="ketik jawaban..." maxlength="40" />
    <button class="btn" id="submitBtn" onclick="checkAnswer()">SUBMIT</button>
  </div>
  <div class="feedback" id="feedback"></div>

  <div class="qr-section" id="qrSection">
    <div class="qr-label">nih thrnya</div>
    <div class="qr-frame"><canvas id="qrCanvas"></canvas></div>
    <div class="qr-link" id="qrLink"></div>
  </div>
</div>

<script>
var ANSWER_HASH='f1c4bb5e7eb3ab36287057702194655304854837ff04c2c7594babc38207f968';
var _r='Gh0QFB9fHR9TRgJHAwscBEseUVlcAABLIiMKQB1dAwNRHh8MWA==';
function _d(b,k){var a=atob(b),o='';for(var i=0;i<a.length;i++)o+=String.fromCharCode(a.charCodeAt(i)^k.charCodeAt(i%k.length));return o;}
var HINTS=[
  '>_ Depannya huruf S',
  '>_ 5 huruf, rising star',
  '>_ Album barunya rilis 6 Maret 2026'
];

var tries=0,lives=3,solved=false,hintRevealed=[false,false,false];
var startTime=Date.now();
var HINT_DELAY=3*60*1000;

document.getElementById('answerInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') checkAnswer();
});

function fmtTime(ms){
  var s=Math.ceil(ms/1000);
  var m=Math.floor(s/60);
  s=s%60;
  return m+'m '+(s<10?'0':'')+s+'s';
}

function updateHintTimers(){
  var elapsed=Date.now()-startTime;
  for(var n=1;n<=3;n++){
    var btn=document.getElementById('h'+n);
    if(hintRevealed[n-1]) continue;
    var unlockAt=HINT_DELAY*n;
    var remaining=unlockAt-elapsed;
    if(remaining<=0){
      if(btn.classList.contains('locked')){
        btn.classList.remove('locked');
        btn.textContent='[ HINT '+n+': klik buat reveal ]';
        btn.onclick=(function(num){return function(){revealHint(num);};})(n);
        btn.style.cursor='pointer';
      }
    } else {
      document.getElementById('t'+n).textContent=fmtTime(remaining);
    }
  }
}

setInterval(updateHintTimers,1000);
updateHintTimers();

function revealHint(n){
  var i=n-1;
  if(hintRevealed[i]) return;
  hintRevealed[i]=true;
  var btn=document.getElementById('h'+n);
  btn.textContent=HINTS[i];
  btn.classList.add('revealed');
  btn.disabled=true;
}

async function sha256(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

async function checkAnswer(){
  if(solved) return;
  var val=document.getElementById('answerInput').value.trim().toLowerCase();
  if(!val) return;
  tries++;
  var fb=document.getElementById('feedback');
  fb.className='feedback';
  void fb.offsetWidth;
  var hash=await sha256(val);
  if(hash===ANSWER_HASH){
    solved=true;
    fb.textContent='> Minal Aidin Wal Faidzin!';
    document.getElementById('answerInput').disabled=true;
    document.getElementById('submitBtn').disabled=true;
    setTimeout(showQR,700);
  } else {
    lives=Math.max(0,lives-1);
    updateLives();
    fb.className='feedback wrong';
    if(lives===0){
      fb.textContent='> GAME OVER.';
      document.getElementById('answerInput').disabled=true;
      document.getElementById('submitBtn').disabled=true;
      var r=document.createElement('button');
      r.className='btn';r.textContent='[ COBA LAGI ]';
      r.style.marginTop='8px';r.style.padding='8px 16px';r.style.fontSize='9px';
      r.onclick=function(){location.reload();};
      document.getElementById('feedback').after(r);
    } else {
      var msgs=['> SALAH! Coba lagi...','> NOPE! Try again...','> ERROR: wrong answer'];
      fb.textContent=msgs[Math.floor(Math.random()*msgs.length)];
      document.getElementById('answerInput').value='';
    }
  }
}

function updateLives(){
  var hearts=document.querySelectorAll('.heart');
  hearts.forEach(function(h,i){ h.classList.toggle('lost',i>=lives); });
}

function showQR(){
  document.getElementById('qrSection').classList.add('show');
  document.getElementById('qrLink').textContent=_d(_r,'riddle2026');
  var canvas=document.getElementById('qrCanvas');
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    canvas.width=180;canvas.height=180;
    canvas.getContext('2d').drawImage(img,0,0,180,180);
  };
  img.onerror=function(){canvas.style.display='none';};
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(_d(_r,'riddle2026'));
}
</script>
</body>
</html>
